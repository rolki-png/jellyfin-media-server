name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "cursor/**"

jobs:
  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck setup-new-github-repo.sh compose_files/validate.sh

  compose-validate:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: bash compose_files/validate.sh --ci
