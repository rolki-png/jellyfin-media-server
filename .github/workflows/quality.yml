name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - Main
      - "cursor/**"
  workflow_dispatch:

jobs:
  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          # build-freeloader-plex.sh is gitignored with freeloader/ (local unlock build).
          shellcheck setup-new-github-repo.sh \
            compose_files/validate.sh \
            compose_files/scripts/homelab-setup.sh \
            compose_files/scripts/boot-ensure-hardlink-policy.sh \
            compose_files/scripts/same-disk-import.sh \
            compose_files/scripts/health-check.sh \
            compose_files/scripts/migrate-appdata.sh \
            compose_files/scripts/plex-init.sh \
            compose_files/scripts/backup-appdata.sh \
            compose_files/scripts/load-dotenv.sh \
            compose_files/systemd/install-media-server-unit.sh

  stack-policy:
    name: Stack policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unittest
        working-directory: compose_files/scripts
        run: PYTHONPATH=. python3 -m unittest test_stack_policy -v

  boot-catchup-tlc:
    name: Boot catch-up TLC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch tla2tools
        run: |
          curl -fsSL -o /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "TLA2TOOLS_JAR=/tmp/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Run BootCatchup models
        run: bash formal/boot_catchup/run.sh

  compose-validate:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: bash compose_files/validate.sh --ci
