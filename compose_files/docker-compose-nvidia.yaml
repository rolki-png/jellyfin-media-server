---
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    com.centurylinklabs.watchtower.enable: "true"

x-linuxserver-env: &linuxserver-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Etc/UTC}

x-tz-env: &tz-env
  TZ: ${TZ:-Etc/UTC}

# Cap container memory to reduce cgroup memory-accounting pressure (see kswapd bad-page freezes).
x-mem-256m: &mem-256m
  mem_limit: 256m
  memswap_limit: 256m

x-mem-512m: &mem-512m
  mem_limit: 512m
  memswap_limit: 512m

x-mem-1g: &mem-1g
  mem_limit: 1g
  memswap_limit: 1g

x-mem-2g: &mem-2g
  mem_limit: 2g
  memswap_limit: 2g

services:
  qbittorrent:
    <<: [*service-defaults, *mem-1g]
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *linuxserver-env
      WEBUI_PORT: 8080
      # DOCKER_MODS: ghcr.io/gabe565/linuxserver-mod-vuetorrent
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/qbittorrent:/config
      - ${COMMON_PATH}/qbittorrent/downloads:/downloads
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
  flaresolverr:
    <<: [*service-defaults, *mem-512m]
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      <<: *tz-env
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_HTML: ${LOG_HTML:-false}
      CAPTCHA_SOLVER: ${CAPTCHA_SOLVER:-none}
    ports:
      - 8191:8191
  prowlarr:
    <<: [*service-defaults, *mem-512m]
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *linuxserver-env
    volumes:
      - ${COMMON_PATH}/configs/prowlarr:/config
    ports:
      - 9696:9696
  jackett:
    <<: [*service-defaults, *mem-512m]
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      <<: *linuxserver-env
    volumes:
      - ${COMMON_PATH}/configs/jackett:/config
    ports:
      - 9117:9117
  sonarr:
    <<: [*service-defaults, *mem-512m]
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *linuxserver-env
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/sonarr:/config
      - ${COMMON_PATH}/sonarr/tv:/tv
      - ${COMMON_PATH}/qbittorrent/downloads:/downloads
    ports:
      - 8989:8989
  radarr:
    <<: [*service-defaults, *mem-512m]
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *linuxserver-env
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/radarr:/config
      - ${COMMON_PATH}/radarr/movies:/movies
      - ${COMMON_PATH}/qbittorrent/downloads:/downloads
    ports:
      - 7878:7878
  jellyfin-init:
    image: alpine:latest
    container_name: jellyfin-init
    user: "0:0"
    # Fix ownership drift (e.g. root-owned plugin dirs from older runs) before
    # jellyfin starts. Jellyfin 10.10+ rewrites plugin meta.json on load and
    # fails startup if any file under /config is not owned by PUID:PGID.
    command:
      - sh
      - -c
      - |
        set -e
        chown -R ${PUID:-1000}:${PGID:-1000} /config /cache
        echo "jellyfin-init: chowned /config and /cache to ${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${COMMON_PATH}/configs/jellyfin:/config
      - ${COMMON_PATH}/jellyfin/cache:/cache
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
  jellyfin:
    <<: [*service-defaults, *mem-2g]
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    depends_on:
      jellyfin-init:
        condition: service_completed_successfully
    environment:
      <<: *linuxserver-env
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      # 1900/SSDP omitted — Home Assistant binds host UDP 1900; Samsung app uses 8096 directly.
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/jellyfin:/config
      - ${COMMON_PATH}/jellyfin/cache:/cache
      - ${COMMON_PATH}/sonarr/tv:/data/tvshows
      - ${COMMON_PATH}/radarr/movies:/data/movies
      - ${COMMON_PATH}/qbittorrent/downloads:/data/media_downloads
    # Intel iGPU (VAAPI/QSV) for hardware transcoding — no discrete GPU required.
    devices:
      - /dev/dri:/dev/dri
  jellyseerr:
    <<: [*service-defaults, *mem-512m]
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      <<: *tz-env
      LOG_LEVEL: ${JELLYSEERR_LOG_LEVEL:-debug}
    ports:
      - 5055:5055
    volumes:
      - ${COMMON_PATH}/configs/jellyseerr:/app/config
  plex:
    <<: [*service-defaults, *mem-2g]
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      <<: *linuxserver-env
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      # Helps Xbox/TV clients discover the server on LAN (set in .env).
      ADVERTISE_IP: ${PLEX_ADVERTISE_IP:-}
    ports:
      - 32400:32400
      - 32400:32400/udp
      - 32469:32469
      - 32469:32469/udp
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/plex:/config
      - ${COMMON_PATH}/plex/transcode:/transcode
      - ${COMMON_PATH}/sonarr/tv:/data/tvshows
      - ${COMMON_PATH}/radarr/movies:/data/movies
    devices:
      - /dev/dri:/dev/dri
  watchtower:
    <<: [*service-defaults, *mem-256m]
    # containrrr/watchtower is unmaintained and fails on Docker 29+ (API min 1.40+).
    image: nickfedor/watchtower:latest
    container_name: watchtower
    environment:
      <<: *tz-env
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_REVIVE_STOPPED: "false"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_TIMEOUT: "120s"
      WATCHTOWER_SCHEDULE: "${WATCHTOWER_SCHEDULE:-0 0 4 * * *}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock