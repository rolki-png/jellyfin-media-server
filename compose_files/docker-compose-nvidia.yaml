---
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    com.centurylinklabs.watchtower.enable: "true"

x-linuxserver-env: &linuxserver-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Etc/UTC}

x-tz-env: &tz-env
  TZ: ${TZ:-Etc/UTC}

services:
  qbittorrent:
    <<: *service-defaults
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *linuxserver-env
      WEBUI_PORT: 8080
      # DOCKER_MODS: ghcr.io/gabe565/linuxserver-mod-vuetorrent
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/qbittorrent:/config
      - ${COMMON_PATH}/qbittorrent/downloads:/downloads
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
  flaresolverr:
    <<: *service-defaults
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      <<: *tz-env
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_HTML: ${LOG_HTML:-false}
      CAPTCHA_SOLVER: ${CAPTCHA_SOLVER:-none}
    ports:
      - 8191:8191
  prowlarr:
    <<: *service-defaults
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *linuxserver-env
    volumes:
      - ${COMMON_PATH}/configs/prowlarr:/config
    ports:
      - 9696:9696
  jackett:
    <<: *service-defaults
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      <<: *linuxserver-env
    volumes:
      - ${COMMON_PATH}/configs/jackett:/config
    ports:
      - 9117:9117
  media-init:
    image: alpine:latest
    container_name: media-init
    user: "0:0"
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /tv /movies
        chown -R ${PUID:-1000}:${PGID:-1000} /tv /movies
        echo "media-init: chowned /tv and /movies to ${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${COMMON_PATH}/sonarr/tv:/tv
      - ${COMMON_PATH}/radarr/movies:/movies
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
  sonarr:
    <<: *service-defaults
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    depends_on:
      media-init:
        condition: service_completed_successfully
    environment:
      <<: *linuxserver-env
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/sonarr:/config
      - ${COMMON_PATH}/sonarr/tv:/tv
      - ${COMMON_PATH}/qbittorrent/downloads:/downloads
    ports:
      - 8989:8989
  radarr:
    <<: *service-defaults
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *linuxserver-env
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/radarr:/config
      - ${COMMON_PATH}/radarr/movies:/movies
      - ${COMMON_PATH}/qbittorrent/downloads:/downloads
    ports:
      - 7878:7878
  jellyfin-init:
    image: alpine:latest
    container_name: jellyfin-init
    user: "0:0"
    # Fix ownership drift (e.g. root-owned plugin dirs from older runs) before
    # jellyfin starts. Jellyfin 10.10+ rewrites plugin meta.json on load and
    # fails startup if any file under /config is not owned by PUID:PGID.
    command:
      - sh
      - -c
      - |
        set -e
        chown -R ${PUID:-1000}:${PGID:-1000} /config /cache
        echo "jellyfin-init: chowned /config and /cache to ${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${COMMON_PATH}/configs/jellyfin:/config
      - ${COMMON_PATH}/jellyfin/cache:/cache
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
  jellyfin:
    <<: *service-defaults
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    depends_on:
      jellyfin-init:
        condition: service_completed_successfully
    environment:
      <<: *linuxserver-env
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_PUBLISHED_SERVER_URL}
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      # 1900/udp: Home Assistant (SSDP) already uses host port 1900 on this machine.
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/jellyfin:/config
      - ${COMMON_PATH}/jellyfin/cache:/cache
      - ${COMMON_PATH}/sonarr/tv:/data/tvshows
      - ${COMMON_PATH}/radarr/movies:/data/movies
      - ${COMMON_PATH}/qbittorrent/downloads:/data/media_downloads
    devices:
      - /dev/dri:/dev/dri
  seerr:
    <<: *service-defaults
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      <<: *tz-env
      LOG_LEVEL: ${SEERR_LOG_LEVEL:-debug}
      PORT: 5055
    ports:
      - 5055:5055
    volumes:
      - ${COMMON_PATH}/configs/jellyseerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      default:
        aliases:
          - jellyseerr
  watchtower:
    <<: *service-defaults
    # containrrr/watchtower is unmaintained and fails on Docker 29+ (API min 1.40+).
    image: nickfedor/watchtower:latest
    container_name: watchtower
    environment:
      <<: *tz-env
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_REVIVE_STOPPED: "false"
      # Poll every 6h while the host is running. A fixed 04:00 cron often never
      # fires on desktops that sleep overnight (logs showed zero scheduled runs).
      # Override in .env: WATCHTOWER_POLL_INTERVAL=86400 or WATCHTOWER_SCHEDULE="0 0 4 * * *"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-21600}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock