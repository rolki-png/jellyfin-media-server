---
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    com.centurylinklabs.watchtower.enable: "true"

x-linuxserver-env: &linuxserver-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Etc/UTC}

x-tz-env: &tz-env
  TZ: ${TZ:-Etc/UTC}

# Cap container memory to reduce cgroup memory-accounting pressure (see kswapd bad-page freezes).
x-mem-256m: &mem-256m
  mem_limit: 256m
  memswap_limit: 256m

x-mem-512m: &mem-512m
  mem_limit: 512m
  memswap_limit: 512m

x-mem-1g: &mem-1g
  mem_limit: 1g
  memswap_limit: 1g

x-mem-2g: &mem-2g
  mem_limit: 2g
  memswap_limit: 2g

# Plex gets extra headroom for library analysis vs active streams.
x-mem-3g: &mem-3g
  mem_limit: 3g
  memswap_limit: 3g

services:
  qbittorrent:
    <<: [*service-defaults, *mem-1g]
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *linuxserver-env
      WEBUI_PORT: 8080
      # DOCKER_MODS: ghcr.io/gabe565/linuxserver-mod-vuetorrent
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/qbittorrent:/config
      - ${COMMON_PATH}/qbittorrent/downloads:/downloads
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
  flaresolverr:
    <<: [*service-defaults, *mem-512m]
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      <<: *tz-env
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_HTML: ${LOG_HTML:-false}
      CAPTCHA_SOLVER: ${CAPTCHA_SOLVER:-none}
    ports:
      - 8191:8191
  # Parked by default — Sonarr/Radarr use Jackett Torznab, not Prowlarr sync.
  # Bring back: COMPOSE_PROFILES=prowlarr docker compose -f docker-compose-nvidia.yaml up -d prowlarr
  prowlarr:
    <<: [*service-defaults, *mem-512m]
    profiles: ["prowlarr"]
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *linuxserver-env
    volumes:
      - ${COMMON_PATH}/configs/prowlarr:/config
    ports:
      - 9696:9696
  jackett:
    <<: [*service-defaults, *mem-512m]
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      <<: *linuxserver-env
    volumes:
      - ${COMMON_PATH}/configs/jackett:/config
    ports:
      - 9117:9117
  sonarr:
    <<: [*service-defaults, *mem-512m]
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *linuxserver-env
      COMMON_PATH: ${COMMON_PATH}
      SAME_DISK_SSD_ROOT: ${SAME_DISK_SSD_ROOT:-/mnt/samsung-media/Isyrr}
      SAME_DISK_HDD_ROOT: ${SAME_DISK_HDD_ROOT:-/mnt/4tb-media-2/Isyrr}
    volumes:
      # Single COMMON_PATH mount so imports can hardlink downloads↔library
      # (separate /tv and /downloads binds look like different filesystems to ln).
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/sonarr:/config
      # Branch roots for same-disk-import.sh (lazy migrate + hardlink).
      - ${SAME_DISK_SSD_ROOT:-/mnt/samsung-media/Isyrr}:${SAME_DISK_SSD_ROOT:-/mnt/samsung-media/Isyrr}
      - ${SAME_DISK_HDD_ROOT:-/mnt/4tb-media-2/Isyrr}:${SAME_DISK_HDD_ROOT:-/mnt/4tb-media-2/Isyrr}
      - ./scripts/same-disk-import.sh:/scripts/same-disk-import.sh:ro
    ports:
      - 8989:8989
  radarr:
    <<: [*service-defaults, *mem-512m]
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *linuxserver-env
      COMMON_PATH: ${COMMON_PATH}
      SAME_DISK_SSD_ROOT: ${SAME_DISK_SSD_ROOT:-/mnt/samsung-media/Isyrr}
      SAME_DISK_HDD_ROOT: ${SAME_DISK_HDD_ROOT:-/mnt/4tb-media-2/Isyrr}
    volumes:
      # Single COMMON_PATH mount so imports can hardlink downloads↔library
      # (separate /movies and /downloads binds look like different filesystems to ln).
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/radarr:/config
      # Branch roots for same-disk-import.sh (lazy migrate + hardlink).
      - ${SAME_DISK_SSD_ROOT:-/mnt/samsung-media/Isyrr}:${SAME_DISK_SSD_ROOT:-/mnt/samsung-media/Isyrr}
      - ${SAME_DISK_HDD_ROOT:-/mnt/4tb-media-2/Isyrr}:${SAME_DISK_HDD_ROOT:-/mnt/4tb-media-2/Isyrr}
      - ./scripts/same-disk-import.sh:/scripts/same-disk-import.sh:ro
    ports:
      - 7878:7878
  # Parked by default (Plex-first). Bring back:
  #   COMPOSE_PROFILES=jellyfin docker compose -f docker-compose-nvidia.yaml up -d jellyfin
  jellyfin-init:
    profiles: ["jellyfin"]
    image: alpine:latest
    container_name: jellyfin-init
    user: "0:0"
    # Fix ownership drift (e.g. root-owned plugin dirs from older runs) before
    # jellyfin starts. Jellyfin 10.10+ rewrites plugin meta.json on load and
    # fails startup if any file under /config is not owned by PUID:PGID.
    command:
      - sh
      - -c
      - |
        set -e
        chown -R ${PUID:-1000}:${PGID:-1000} /config /cache
        echo "jellyfin-init: chowned /config and /cache to ${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${COMMON_PATH}/configs/jellyfin:/config
      - ${COMMON_PATH}/jellyfin/cache:/cache
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
  jellyfin:
    <<: [*service-defaults, *mem-2g]
    profiles: ["jellyfin"]
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    depends_on:
      jellyfin-init:
        condition: service_completed_successfully
    environment:
      <<: *linuxserver-env
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      # 1900/SSDP omitted — Home Assistant binds host UDP 1900; Samsung app uses 8096 directly.
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/jellyfin:/config
      - ${COMMON_PATH}/jellyfin/cache:/cache
      - ${COMMON_PATH}/sonarr/tv:/data/tvshows
      - ${COMMON_PATH}/radarr/movies:/data/movies
      - ${COMMON_PATH}/qbittorrent/downloads:/data/media_downloads
    # Intel iGPU (VAAPI/QSV) for hardware transcoding — no discrete GPU required.
    devices:
      - /dev/dri:/dev/dri
  jellyseerr:
    <<: [*service-defaults, *mem-512m]
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      <<: *tz-env
      LOG_LEVEL: ${JELLYSEERR_LOG_LEVEL:-debug}
    ports:
      - 5055:5055
    volumes:
      - ${COMMON_PATH}/configs/jellyseerr:/app/config
  plex-init:
    image: alpine:latest
    container_name: plex-init
    user: "0:0"
    # Point Plex transcode cache at /transcode (local disk), not mergerfs under /config.
    # $$ escapes shell vars so Compose does not interpolate $cache / $prefs as empty.
    command:
      - sh
      - -c
      - |
        set -e
        chown -R ${PUID:-1000}:${PGID:-1000} /config /transcode
        cache="/config/Library/Application Support/Plex Media Server/Cache"
        mkdir -p "$$cache"
        rm -rf "$$cache/Transcode"
        ln -sf /transcode "$$cache/Transcode"
        prefs="$$cache/../Preferences.xml"
        if [ -f "$$prefs" ] && ! grep -q 'TranscoderTempDirectory="/transcode"' "$$prefs"; then
          sed -i 's/TranscoderTempDirectory="[^"]*"/TranscoderTempDirectory="\/transcode"/' "$$prefs" || \
          sed -i 's/<Preferences /<Preferences TranscoderTempDirectory="\/transcode" /' "$$prefs"
        fi
        echo "plex-init: transcode cache -> /transcode, chowned to ${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${COMMON_PATH}/configs/plex:/config
      - ${PLEX_TRANSCODE_DIR:-/var/lib/plex-transcode}:/transcode
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
  plex:
    <<: [*service-defaults, *mem-3g]
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    depends_on:
      plex-init:
        condition: service_completed_successfully
    environment:
      <<: *linuxserver-env
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      # LAN URL for Xbox/TV clients; set PLEX_ADVERTISE_IP in .env (see .env.example).
      ADVERTISE_IP: ${PLEX_ADVERTISE_IP:-}
    ports:
      - 32400:32400
      - 32400:32400/udp
      - 32469:32469
      - 32469:32469/udp
      # GDM LAN discovery (Xbox / nearby clients)
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/plex:/config
      # Keep transcode off mergerfs — FUSE is too slow for live streams.
      # homelab-setup.sh sets Plex TranscoderTempDirectory=/transcode; mount must be local disk.
      - ${PLEX_TRANSCODE_DIR:-/var/lib/plex-transcode}:/transcode
      - ${COMMON_PATH}/sonarr/tv:/data/tvshows
      - ${COMMON_PATH}/radarr/movies:/data/movies
    devices:
      - /dev/dri:/dev/dri
  watchtower:
    <<: [*service-defaults, *mem-256m]
    # containrrr/watchtower is unmaintained and fails on Docker 29+ (API min 1.40+).
    # Use the maintained nickfedor fork: https://watchtower.nickfedor.com/
    image: nickfedor/watchtower:latest
    container_name: watchtower
    environment:
      <<: *tz-env
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_REVIVE_STOPPED: "false"
      # Rolling restart is incompatible with Compose depends_on (plex/jellyfin init).
      # See https://watchtower.nickfedor.com/latest/advanced-features/linked-containers/
      WATCHTOWER_ROLLING_RESTART: "false"
      WATCHTOWER_TIMEOUT: "120s"
      # Poll while the host is on (default 6h). Do not set both poll interval and schedule.
      # For a fixed daily time instead: set WATCHTOWER_SCHEDULE in .env and clear
      # WATCHTOWER_POLL_INTERVAL (empty) so this default is unused.
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-21600}
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock