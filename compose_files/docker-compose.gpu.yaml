---
# GPU overlay – adds NVIDIA hardware-transcoding support to Jellyfin and Plex.
# Applied automatically by start.sh / update.sh when an NVIDIA GPU is detected.
# Manual usage:
#   docker compose -f docker-compose.yaml -f docker-compose.gpu.yaml up -d

services:
  jellyfin:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
  plex:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
