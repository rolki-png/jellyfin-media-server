---
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    # Docker's current default-class driver; built-in rotation (replaces json-file).
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    com.centurylinklabs.watchtower.enable: "true"

x-linuxserver-env: &linuxserver-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Etc/UTC}

x-tz-env: &tz-env
  TZ: ${TZ:-Etc/UTC}

# Docker marks a hung app "unhealthy"; media-monitor.timer restarts it and alerts.
x-health: &health
  interval: 1m
  timeout: 10s
  retries: 3
  start_period: 2m

# Cap container memory to reduce cgroup memory-accounting pressure (see kswapd bad-page freezes).
# mem_limit == memswap_limit disables swap. deploy.resources.limits.memory cannot set that,
# so these Compose service keys are intentional, not leftovers from Swarm-era files.
x-mem-256m: &mem-256m
  mem_limit: 256m
  memswap_limit: 256m

x-mem-512m: &mem-512m
  mem_limit: 512m
  memswap_limit: 512m

x-mem-1g: &mem-1g
  mem_limit: 1g
  memswap_limit: 1g

x-mem-2g: &mem-2g
  mem_limit: 2g
  memswap_limit: 2g

# Plex gets extra headroom for library analysis vs active streams.
x-mem-3g: &mem-3g
  mem_limit: 3g
  memswap_limit: 3g

services:
  qbittorrent:
    <<: [*service-defaults, *mem-1g]
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *linuxserver-env
      WEBUI_PORT: 8080
      # DOCKER_MODS: ghcr.io/gabe565/linuxserver-mod-vuetorrent
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${APPDATA_PATH}/qbittorrent:/config
      - ${COMMON_PATH}/qbittorrent/downloads:/downloads
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/"]
  flaresolverr:
    <<: [*service-defaults, *mem-512m]
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      <<: *tz-env
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_HTML: ${LOG_HTML:-false}
    ports:
      # Jackett reaches FlareSolverr on the compose network; do not publish the solver to the LAN.
      - 127.0.0.1:8191:8191
  # Parked by default — Sonarr/Radarr use Jackett Torznab, not Prowlarr sync.
  # Bring back: COMPOSE_PROFILES=prowlarr docker compose up -d prowlarr
  prowlarr:
    <<: [*service-defaults, *mem-512m]
    profiles: ["prowlarr"]
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *linuxserver-env
    volumes:
      - ${APPDATA_PATH}/prowlarr:/config
    ports:
      - 9696:9696
  jackett:
    <<: [*service-defaults, *mem-512m]
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      <<: *linuxserver-env
    volumes:
      - ${APPDATA_PATH}/jackett:/config
    ports:
      - 9117:9117
  sonarr:
    <<: [*service-defaults, *mem-1g]
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *linuxserver-env
      COMMON_PATH: ${COMMON_PATH}
      SAME_DISK_SSD_ROOT: ${SAME_DISK_SSD_ROOT:-/mnt/samsung-media/Isyrr}
      SAME_DISK_HDD_ROOT: ${SAME_DISK_HDD_ROOT:-/mnt/4tb-media-2/Isyrr}
    volumes:
      # Single COMMON_PATH mount so imports can hardlink downloads↔library
      # (separate /tv and /downloads binds look like different filesystems to ln).
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${APPDATA_PATH}/sonarr:/config
      # Branch roots for same-disk-import.sh (lazy migrate + hardlink).
      - ${SAME_DISK_SSD_ROOT:-/mnt/samsung-media/Isyrr}:${SAME_DISK_SSD_ROOT:-/mnt/samsung-media/Isyrr}
      - ${SAME_DISK_HDD_ROOT:-/mnt/4tb-media-2/Isyrr}:${SAME_DISK_HDD_ROOT:-/mnt/4tb-media-2/Isyrr}
      - ./scripts/same-disk-import.sh:/scripts/same-disk-import.sh:ro
    ports:
      - 8989:8989
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/ping"]
  radarr:
    <<: [*service-defaults, *mem-1g]
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *linuxserver-env
      COMMON_PATH: ${COMMON_PATH}
      SAME_DISK_SSD_ROOT: ${SAME_DISK_SSD_ROOT:-/mnt/samsung-media/Isyrr}
      SAME_DISK_HDD_ROOT: ${SAME_DISK_HDD_ROOT:-/mnt/4tb-media-2/Isyrr}
    volumes:
      # Single COMMON_PATH mount so imports can hardlink downloads↔library
      # (separate /movies and /downloads binds look like different filesystems to ln).
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${APPDATA_PATH}/radarr:/config
      # Branch roots for same-disk-import.sh (lazy migrate + hardlink).
      - ${SAME_DISK_SSD_ROOT:-/mnt/samsung-media/Isyrr}:${SAME_DISK_SSD_ROOT:-/mnt/samsung-media/Isyrr}
      - ${SAME_DISK_HDD_ROOT:-/mnt/4tb-media-2/Isyrr}:${SAME_DISK_HDD_ROOT:-/mnt/4tb-media-2/Isyrr}
      - ./scripts/same-disk-import.sh:/scripts/same-disk-import.sh:ro
    ports:
      - 7878:7878
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:7878/ping"]
  # Parked by default (Plex-first). Bring back:
  #   COMPOSE_PROFILES=jellyfin docker compose up -d jellyfin
  jellyfin-init:
    profiles: ["jellyfin"]
    image: alpine:latest
    container_name: jellyfin-init
    user: "0:0"
    # Fix ownership drift (e.g. root-owned plugin dirs from older runs) before
    # jellyfin starts. Jellyfin 10.10+ rewrites plugin meta.json on load and
    # fails startup if any file under /config is not owned by PUID:PGID.
    command:
      - sh
      - -c
      - |
        set -e
        chown -R ${PUID:-1000}:${PGID:-1000} /config /cache
        echo "jellyfin-init: chowned /config and /cache to ${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${APPDATA_PATH}/jellyfin:/config
      - ${COMMON_PATH}/jellyfin/cache:/cache
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    restart: "no"
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"
        compress: "false"
  jellyfin:
    <<: [*service-defaults, *mem-2g]
    profiles: ["jellyfin"]
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    depends_on:
      jellyfin-init:
        condition: service_completed_successfully
    environment:
      <<: *linuxserver-env
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      # 1900/SSDP omitted — Home Assistant binds host UDP 1900; Samsung app uses 8096 directly.
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${APPDATA_PATH}/jellyfin:/config
      - ${COMMON_PATH}/jellyfin/cache:/cache
      - ${COMMON_PATH}/sonarr/tv:/data/tvshows
      - ${COMMON_PATH}/radarr/movies:/data/movies
      - ${COMMON_PATH}/qbittorrent/downloads:/data/media_downloads
    # Intel iGPU (VAAPI/QSV) for hardware transcoding — no discrete GPU required.
    devices:
      - /dev/dri:/dev/dri
  # Jellyseerr/Overseerr merged into Seerr. Same config dir; first start migrates automatically.
  # https://docs.seerr.dev/migration-guide/
  seerr:
    <<: [*service-defaults, *mem-512m]
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      <<: *tz-env
      LOG_LEVEL: ${SEERR_LOG_LEVEL:-debug}
      PORT: 5055
    ports:
      - 5055:5055
    volumes:
      - ${APPDATA_PATH}/jellyseerr:/app/config
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5055/api/v1/settings/public",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
  plex-init:
    image: alpine:latest
    container_name: plex-init
    user: "0:0"
    command: ["/bin/sh", "/scripts/plex-init.sh"]
    volumes:
      - ${APPDATA_PATH}/plex:/config
      - ${PLEX_TRANSCODE_DIR:-/var/lib/plex-transcode}:/transcode
      - ./scripts/plex-init.sh:/scripts/plex-init.sh:ro
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    restart: "no"
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"
        compress: "false"
  plex:
    <<: [*service-defaults, *mem-3g]
    # Locally built image: LSIO plex + Freeloader feature-unlock .so (see freeloader/).
    # Plex updates are rebuilds: bash scripts/build-freeloader-plex.sh, then up -d plex.
    image: freeloader-plex:lsio
    build:
      context: ./freeloader
    container_name: plex
    labels:
      # Overrides the x-service-defaults merge. Watchtower must stay off plex:
      # a pull would replace this patched local image with upstream and silently
      # drop the feature unlock. stack_policy.layout enforces the "false" value.
      com.centurylinklabs.watchtower.enable: "false"
    depends_on:
      plex-init:
        condition: service_completed_successfully
    environment:
      <<: *linuxserver-env
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      # LAN URL for Xbox/TV clients; set PLEX_ADVERTISE_IP in .env (see .env.example).
      ADVERTISE_IP: ${PLEX_ADVERTISE_IP:-}
      # Optional Freeloader hook trace. Set in .env to a path under /config to
      # preload plexmediaserver_traffic_logger.so; leave empty for normal runs.
      PLEX_TRAFFIC_LOG: ${PLEX_TRAFFIC_LOG:-}
    ports:
      - 32400:32400
      - 32400:32400/udp
      - 32469:32469
      - 32469:32469/udp
      # GDM LAN discovery (Xbox / nearby clients)
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      # SQLite metadata on local SSD (APPDATA_PATH), not mergerfs.
      - ${APPDATA_PATH}/plex:/config
      # Keep transcode off mergerfs — FUSE is too slow for live streams.
      # homelab-setup.sh sets Plex TranscoderTempDirectory=/transcode; mount must be local disk.
      - ${PLEX_TRANSCODE_DIR:-/var/lib/plex-transcode}:/transcode
      - ${COMMON_PATH}/sonarr/tv:/data/tvshows
      - ${COMMON_PATH}/radarr/movies:/data/movies
      # Host wrapper: PLEX_TRAFFIC_LOG preload without image rebuild.
      - ./freeloader/wrapper.sh:/usr/lib/plexmediaserver/plex-crack-wrapper.sh:ro
    devices:
      - /dev/dri:/dev/dri
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:32400/identity"]
  tautulli:
    <<: [*service-defaults, *mem-512m]
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    depends_on:
      - plex
    environment:
      <<: *linuxserver-env
    volumes:
      - ${APPDATA_PATH}/tautulli:/config
    ports:
      - 8181:8181
  unpackerr:
    <<: [*service-defaults, *mem-256m]
    image: ghcr.io/unpackerr/unpackerr:latest
    container_name: unpackerr
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      - radarr
      - sonarr
    environment:
      <<: *tz-env
      UN_LOG_LEVEL: info
      UN_LOG_FILE: /config/unpackerr.log
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: filepath:/run/secrets/sonarr_api_key
      UN_SONARR_0_TIMEOUT: 10s
      UN_SONARR_0_PATHS_0: /downloads
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: filepath:/run/secrets/radarr_api_key
      UN_RADARR_0_TIMEOUT: 10s
      UN_RADARR_0_PATHS_0: /downloads
    volumes:
      - ${COMMON_PATH}/qbittorrent/downloads:/downloads
      - ${APPDATA_PATH}/unpackerr:/config
      - ${APPDATA_PATH}/unpackerr/radarr_api_key:/run/secrets/radarr_api_key:ro
      - ${APPDATA_PATH}/unpackerr/sonarr_api_key:/run/secrets/sonarr_api_key:ro
  bazarr:
    <<: [*service-defaults, *mem-512m]
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    depends_on:
      - radarr
      - sonarr
    environment:
      <<: *linuxserver-env
    ports:
      - 6767:6767
    volumes:
      # Same COMMON_PATH as *arr so sidecar SRT lands next to the video (no path maps).
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${APPDATA_PATH}/bazarr:/config
  recyclarr:
    <<: [*service-defaults, *mem-256m]
    # Recyclarr no longer publishes :latest. Major tag :8 receives 8.x updates.
    # https://recyclarr.dev/guide/installation/docker/
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      - radarr
      - sonarr
    environment:
      <<: *tz-env
      CRON_SCHEDULE: ${RECYCLARR_CRON_SCHEDULE:-@daily}
    volumes:
      - ./recyclarr:/config
  watchtower:
    <<: [*service-defaults, *mem-256m]
    # containrrr/watchtower is unmaintained and fails on Docker 29+ (API min 1.40+).
    # Use the maintained nickfedor fork: https://watchtower.nickfedor.com/
    image: nickfedor/watchtower:latest
    container_name: watchtower
    environment:
      <<: *tz-env
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_REVIVE_STOPPED: "false"
      # Rolling restart is incompatible with Compose depends_on (plex/jellyfin init).
      # See https://watchtower.nickfedor.com/latest/advanced-features/linked-containers/
      WATCHTOWER_ROLLING_RESTART: "false"
      WATCHTOWER_TIMEOUT: "120s"
      # Notify about new images instead of pulling them: an unattended :latest bump
      # can break the *arr pipeline silently. Update deliberately with
      # `docker compose pull && docker compose up -d` (see AGENTS.md).
      WATCHTOWER_MONITOR_ONLY: ${WATCHTOWER_MONITOR_ONLY:-true}
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL:-}
      # Poll while the host is on (default 6h). Do not set both poll interval and schedule.
      # For a fixed daily time instead: set WATCHTOWER_SCHEDULE in .env and clear
      # WATCHTOWER_POLL_INTERVAL (empty) so this default is unused.
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-21600}
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  # NZB360-style control center (Sonarr/Radarr/qBit/Plex + Docker). First visit: setup wizard.
  # Use compose DNS URLs in the wizard: http://sonarr:8989, http://radarr:7878,
  # http://qbittorrent:8080, http://plex:32400
  # Entrypoint patches Panelarr for qBittorrent 5.x login (204+cookie, not body "Ok.").
  panelarr:
    <<: [*service-defaults, *mem-512m]
    image: ghcr.io/syms-dev/panelarr:latest
    container_name: panelarr
    entrypoint: ["/bin/sh", "/scripts/panelarr-entrypoint.sh"]
    environment:
      <<: *tz-env
    ports:
      - 8000:8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${APPDATA_PATH}/panelarr:/config
      - ./scripts/panelarr-entrypoint.sh:/scripts/panelarr-entrypoint.sh:ro
  # Dashboard beside Panelarr (same compose DNS). First visit creates the admin user.
  # Apps: http://sonarr:8989, http://radarr:7878, http://qbittorrent:8080, http://plex:32400,
  # http://seerr:5055, http://tautulli:8181, http://bazarr:6767, http://jackett:9117
  # SECRET_ENCRYPTION_KEY encrypts integration secrets in /appdata; keep the .env value.
  homarr:
    <<: [*service-defaults, *mem-1g]
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    environment:
      <<: *tz-env
      SECRET_ENCRYPTION_KEY: ${HOMARR_SECRET_ENCRYPTION_KEY:-}
    ports:
      - 7575:7575
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${APPDATA_PATH}/homarr:/appdata

  # Paperless-ngx document archive (http://localhost:8010). SQLite under APPDATA_PATH/paperless/data
  # (nightly `sqlite3 .backup` by backup-appdata.sh). Drop files into APPDATA_PATH/paperless/consume.
  # PAPERLESS_URL must be the URL you browse; extra origins cover LAN and tailnet IP access.
  paperless-redis:
    <<: [*service-defaults, *mem-256m]
    image: docker.io/library/redis:8
    container_name: paperless-redis
    healthcheck:
      <<: *health
      test: ["CMD", "redis-cli", "ping"]
  # Office documents, e-mails and RTF: Tika extracts text, Gotenberg renders the PDF archive copy.
  paperless-gotenberg:
    <<: [*service-defaults, *mem-1g]
    image: docker.io/gotenberg/gotenberg:8
    container_name: paperless-gotenberg
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
  # Tika 4 removed the /tika/form endpoints paperless calls; stay on 3.x until paperless moves.
  paperless-tika:
    <<: [*service-defaults, *mem-1g]
    image: docker.io/apache/tika:3.3.3.0
    container_name: paperless-tika
  paperless:
    <<: [*service-defaults, *mem-3g]
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    depends_on:
      - paperless-redis
      - paperless-gotenberg
      - paperless-tika
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_ENDPOINT: http://paperless-tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?set PAPERLESS_SECRET_KEY in .env}
      PAPERLESS_URL: ${PAPERLESS_URL:?set PAPERLESS_URL in .env}
      PAPERLESS_CSRF_TRUSTED_ORIGINS: ${PAPERLESS_EXTRA_ORIGINS:-}
      PAPERLESS_ALLOWED_HOSTS: "*"
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?set PAPERLESS_ADMIN_PASSWORD in .env}
      PAPERLESS_TIME_ZONE: ${TZ:-Etc/UTC}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-eng}
      PAPERLESS_OCR_LANGUAGES: ${PAPERLESS_OCR_LANGUAGES:-}
      PAPERLESS_TASK_WORKERS: "1"
      PAPERLESS_THREADS_PER_WORKER: "2"
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
      USERMAP_UID: ${PUID:-1000}
      USERMAP_GID: ${PGID:-1000}
    ports:
      - 8010:8000
    volumes:
      - ${APPDATA_PATH}/paperless/data:/usr/src/paperless/data
      - ${APPDATA_PATH}/paperless/media:/usr/src/paperless/media
      - ${APPDATA_PATH}/paperless/export:/usr/src/paperless/export
      - ${APPDATA_PATH}/paperless/consume:/usr/src/paperless/consume
