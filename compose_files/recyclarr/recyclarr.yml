# Recyclarr v8 — TRaSH Guides sync
# Profile titles must match compose_files/scripts/stack_policy/profiles.py
# (UHD Bluray + WEB / WEB-2160p) — homelab-setup bulk-assign reads those names.
# Prefer 4K, fall back to 1080p then 720p.
# TV cannot play Dolby Vision → reject ALL DoVi (not only DV without HDR fallback).
# SDR hard-reject disabled for WEB: many 4K WEB releases omit "HDR" in the title
# and were incorrectly scored -10000, so Sonarr fell back to 1080p.

radarr:
  uhd-bluray-web:
    base_url: http://radarr:7878
    api_key: !secret radarr_api_key

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f # UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
          except:
            - Reject Dolby Vision
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
        qualities:
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-2160p
          - name: Remux-1080p
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-720p

    custom_format_groups:
      add:
        - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76 # DV (w/o HDR fallback)

    custom_formats:
      # Keep SDR CF synced but do not hard-reject untagged 4K WEB
      - trash_ids:
          - 9c38ebb7384dada637be8899efa68e6f # SDR
        assign_scores_to:
          - name: UHD Bluray + WEB
            score: 0

sonarr:
  web-2160p:
    base_url: http://sonarr:8989
    api_key: !secret sonarr_api_key

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6 # WEB-2160p
        reset_unmatched_scores:
          enabled: true
          except:
            - Reject Dolby Vision
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
        qualities:
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-2160p
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-720p

    custom_format_groups:
      add:
        - trash_id: d776a1ea912a117d66d83b880ff2055d # DV (w/o HDR fallback)

    custom_formats:
      - trash_ids:
          - 2016d1676f5ee13a5b7257ff86ac9a93 # SDR
        assign_scores_to:
          - name: WEB-2160p
            score: 0
