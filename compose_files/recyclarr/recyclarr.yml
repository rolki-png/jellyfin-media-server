# Recyclarr v8 — TRaSH Guides sync
# Profile titles must match compose_files/scripts/stack_policy/profiles.py
# (UHD Bluray + WEB / WEB-2160p) — homelab-setup bulk-assign reads those names.
# Playback target: Plex on Xbox Series X → Samsung UE65U8092 (display only, LAN).
# Prefer 4K HDR10/HDR10+ WEB that Xbox can Direct Play (HEVC + AAC/DD/DD+).
# Hard-reject TrueHD / DTS-HD: not in Plex Xbox MKV Direct Play, and this TV
# does not decode TrueHD or DTS-HD on HDMI (DD+ / DD+ Atmos only).
# min_format_score -9999: untagged WEB still grabs; -10000 rejects do not.
# TV cannot play Dolby Vision → reject ALL DoVi (not only DV without HDR fallback).
# SDR hard-reject disabled for WEB: many 4K WEB releases omit "HDR" in the title
# and were incorrectly scored -10000, so Sonarr fell back to 1080p.

radarr:
  uhd-bluray-web:
    base_url: http://radarr:7878
    api_key: !secret radarr_api_key

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f # UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
          except:
            - Reject Dolby Vision
            - TrueHD ATMOS
            - TrueHD
            - DTS X
            - DTS-HD MA
            - DTS-HD HRA
            - DTS
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
        min_format_score: -9999
        qualities:
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-2160p
          - name: Remux-1080p
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-720p

    custom_format_groups:
      add:
        - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76 # DV (w/o HDR fallback)

    custom_formats:
      # Keep SDR CF synced but do not hard-reject untagged 4K WEB
      - trash_ids:
          - 9c38ebb7384dada637be8899efa68e6f # SDR
        assign_scores_to:
          - name: UHD Bluray + WEB
            score: 0
      - trash_ids:
          - 496f355514737f7d83bf7aa4d24f8169 # TrueHD ATMOS
          - 3cafb66171b47f226146a0770576870f # TrueHD
          - 2f22d89048b01681dde8afe203bf2e95 # DTS X
          - dcf3ec6938fa32445f590a4da84256cd # DTS-HD MA
          - 8e109e50e0a0b83a5098b056e13bf6db # DTS-HD HRA
          - 1c1a4c5e823891c75bc50380a6866f73 # DTS
        assign_scores_to:
          - name: UHD Bluray + WEB
            score: -10000
      - trash_ids:
          - 1af239278386be2919e1bcee0bde047e # DD+ ATMOS
          - 185f1dd7264c4562b9022d963ac37424 # DD+
          - 240770601cc226190c367ef59aba7463 # AAC
        assign_scores_to:
          - name: UHD Bluray + WEB
            score: 100

